<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift King NTL</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #16213e;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa726 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .game-title {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .loading-text {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fallback-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 999;
            display: none;
        }
        
        .fallback-content.show {
            display: block;
        }
        
        .play-button {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        
        .play-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 加载动画 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="game-title">🏎️ Drift King NTL</div>
            <div class="loading-text">Loading game...</div>
            <div class="loading-text" style="font-size: 14px; opacity: 0.8; margin-top: 10px;">这个游戏需要较长的加载时间，请耐心等待...</div>
            <div class="spinner"></div>
        </div>
        
        <!-- 游戏iframe -->
        <iframe 
            id="gameFrame"
            src="https://games.crazygames.com/en_US/drift-king-ntl/index.html" 
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-fullscreen allow-forms allow-popups allow-top-navigation"
            allowfullscreen
            onload="hideLoading()"
            onerror="showFallback()">
        </iframe>
        
        <!-- 备用内容 -->
        <div class="fallback-content" id="fallbackContent">
            <h2>🏎️ Drift King NTL</h2>
            <p>游戏无法加载</p>
            <a href="https://www.crazygames.com/game/drift-king-ntl" target="_blank" class="play-button">
                🎮 在CrazyGames上玩
            </a>
        </div>
    </div>

    <script>
        let loadingTimeout;
        let retryCount = 0;
        const maxRetries = 3;
        
        function hideLoading() {
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    overlay.classList.add('hidden');
                }
            }, 1000);
        }
        
        function showFallback() {
            const overlay = document.getElementById('loadingOverlay');
            const fallback = document.getElementById('fallbackContent');
            
            if (overlay) overlay.style.display = 'none';
            if (fallback) fallback.classList.add('show');
        }
        
        function retryLoading() {
            if (retryCount < maxRetries) {
                retryCount++;
                console.log(`重试加载游戏 (${retryCount}/${maxRetries})`);
                
                const iframe = document.getElementById('gameFrame');
                const currentSrc = iframe.src;
                iframe.src = '';
                
                setTimeout(() => {
                    iframe.src = currentSrc + '?retry=' + retryCount;
                }, 1000);
                
                // 重置超时
                clearTimeout(loadingTimeout);
                loadingTimeout = setTimeout(() => {
                    retryLoading();
                }, 15000); // 15秒后重试
            } else {
                showFallback();
            }
        }
        
        // 延长等待时间到15秒，因为Drift King加载较慢
        loadingTimeout = setTimeout(() => {
            retryLoading();
        }, 15000);
        
        // 页面加载完成后隐藏加载动画
        window.addEventListener('load', () => {
            clearTimeout(loadingTimeout);
            hideLoading();
        });
        
        // 添加iframe错误处理
        document.getElementById('gameFrame').addEventListener('error', function() {
            console.log('iframe加载错误，尝试重试...');
            retryLoading();
        });
    </script>
</body>
</html>
