<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrangle Ranch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            width: 90%;
            max-width: 800px;
            height: 70%;
            min-height: 400px;
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-info {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .game-info h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .game-info p {
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        
        iframe {
            width: 100%;
            max-width: 600px;
            height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .play-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .play-button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <h2>Wrangle Ranch</h2>
            <p>Experience the wild west ranch management adventure!</p>
        </div>
        
        <iframe src="https://itch.io/embed/3777071" frameborder="0" allowfullscreen>
            <p>Your browser doesn't support iframes.</p>
        </iframe>
        
        <a href="https://benbonk.itch.io/wrangle-ranch" target="_blank" class="play-button">
            Play Full Game on itch.io
        </a>
    </div>
</body>
</html>
